<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Animation</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="canvas1"></canvas>

    <script>
        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const numberOfParticles = 2000;

        class Particle {
            constructor(x, y) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.destX = x;
                this.destY = y;
                this.size = 1.5;
                this.color = '#ff3300'; // မီးတောက်ရောင် သို့မဟုတ် အနီရောင်
                this.friction = 0.95;
                this.ease = 0.05;
                this.vx = 0;
                this.vy = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.vx = (this.destX - this.x) * this.ease;
                this.vy = (this.destY - this.y) * this.ease;
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        function createShape() {
            // လက်ခလယ်ပုံစံဖြစ်အောင် Pixel points များကို ခန့်မှန်းရေးဆွဲခြင်း
            const points = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 50;

            // လက်ဖဝါး (Palm)
            for (let i = 0; i < 400; i++) {
                points.push({ x: centerX - 40 + Math.random() * 80, y: centerY - 20 + Math.random() * 60 });
            }
            // လက်ညှိုး (Index finger - ခေါက်ထားပုံ)
            for (let i = 0; i < 150; i++) {
                points.push({ x: centerX - 45 + Math.random() * 20, y: centerY - 35 + Math.random() * 15 });
            }
            // လက်ခလယ် (Middle finger - ထောင်ထားပုံ)
            for (let i = 0; i < 600; i++) {
                points.push({ x: centerX - 10 + Math.random() * 20, y: centerY - 150 + Math.random() * 130 });
            }
            // လက်သူကြွယ် (Ring finger - ခေါက်ထားပုံ)
            for (let i = 0; i < 150; i++) {
                points.push({ x: centerX + 25 + Math.random() * 20, y: centerY - 35 + Math.random() * 15 });
            }
            // လက်သန်း (Pinky - ခေါက်ထားပုံ)
            for (let i = 0; i < 100; i++) {
                points.push({ x: centerX + 50 + Math.random() * 15, y: centerY - 25 + Math.random() * 15 });
            }
            // လက်မ (Thumb)
            for (let i = 0; i < 200; i++) {
                points.push({ x: centerX - 70 + Math.random() * 30, y: centerY - 10 + Math.random() * 30 });
            }

            return points;
        }

        function init() {
            const shapePoints = createShape();
            particles = [];
            for (let i = 0; i < shapePoints.length; i++) {
                particles.push(new Particle(shapePoints[i].x, shapePoints[i].y));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
