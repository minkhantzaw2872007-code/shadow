<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Heart Animation</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function heartShape(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t))
    };
}

for(let i = 0; i < 1000; i++){
    let t = Math.random() * Math.PI * 2;
    let pos = heartShape(t);
    particles.push({
        x: pos.x * 20,
        y: pos.y * 20,
        z: Math.random() * 200 - 100
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    let time = Date.now() * 0.001;

    particles.forEach(p => {
        let angle = time;
        let x = p.x * Math.cos(angle) - p.z * Math.sin(angle);
        let z = p.x * Math.sin(angle) + p.z * Math.cos(angle);

        let scale = 400 / (400 + z);
        let px = x * scale + canvas.width/2;
        let py = p.y * scale + canvas.height/2;

        ctx.beginPath();
        ctx.arc(px, py, 2 * scale, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,0,80,${scale})`;
        ctx.fill();
    });

    requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
