<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Projects</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #0d1117; color: white; text-align: center; }
        h1 { color: #58a6ff; }
        .list-container { max-width: 500px; margin: 20px auto; }
        .link-card { 
            background: #161b22; padding: 15px; margin: 10px 0; 
            border-radius: 8px; border: 1px solid #30363d;
            display: block; text-decoration: none; color: #58a6ff; font-weight: bold;
        }
        .link-card:hover { background: #1f6feb; color: white; }
    </style>
</head>
<body>

    <h1>📁 My Shadow Projects</h1>
    <div class="list-container" id="file-list"></div>

    <script>
        // သင့်ရဲ့ ဖိုင်စာရင်း,
        const projects = ["heart", "heart2", "heart3", "heart4", "heart5", "heart6", "universe", "universe2"];
        const container = document.getElementById('file-list');

        projects.forEach(name => {
            const a = document.createElement('a');
            a.className = 'link-card';
            a.href = name + ".html";
            a.textContent = name.toUpperCase();
            container.appendChild(a);
        });
    </script>
</body>
</html>
