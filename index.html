<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Projects</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            background-color: #000000; 
            color: #ffffff; 
            text-align: center;
        }
        h1 { color: #ffcc00; margin-bottom: 30px; }
        .list-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .link-card { 
            background: #1a1a1a; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #333;
            transition: 0.3s;
            display: block;
            text-decoration: none;
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
        }
        .link-card:hover { 
            background: #ffcc00; 
            color: #000; 
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Shadow Project List</h1>

    <div class="list-container" id="file-list">
        </div>

    <script>
        // --- ဒီနေရာမှာ သင့်ဖိုင်နာမည်တွေကို ရေးထည့်ပါ ---
        // ဥပမာ- "heart.html" ရှိရင် "heart" လို့ ထည့်ပါ
        const projects = [
            "heart", 
            "test",
            "animation"
        ]; 

        const container = document.getElementById('file-list');

        projects.forEach(projectName => {
            const a = document.createElement('a');
            a.className = 'link-card';
            a.href = projectName + ".html"; // ဖိုင်လမ်းကြောင်းချိတ်မယ်
            a.textContent = projectName.toUpperCase(); // စာလုံးကြီးနဲ့ ပြမယ်
            
            container.appendChild(a);
        });
    </script>
</body>
</html>
