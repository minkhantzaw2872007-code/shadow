<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Projects List</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #1a1a1a; color: white; }
        h2 { border-bottom: 2px solid #ffcc00; padding-bottom: 10px; color: #ffcc00; }
        #file-list { margin-top: 20px; }
        .link-card { 
            background: #2d2d2d; padding: 15px 25px; margin: 12px 0; 
            border-radius: 10px; transition: 0.3s;
            display: flex; align-items: center; border-left: 5px solid #ffcc00;
        }
        .link-card a { 
            text-decoration: none; color: #ffffff; font-size: 18px;
            text-transform: capitalize; width: 100%;
        }
        .link-card:hover { transform: translateX(10px); background: #3d3d3d; }
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

    <h2>📁 My Shadow Projects</h2>
    <div id="file-list" class="loading">ဖိုင်များကို ရှာဖွေနေပါသည်...</div>

    <script>
        // သင့်ရဲ့ အချက်အလက်များ
        const username = "minkhantzaw2872007-code";
        const repo = "shadow";
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/`;

        async function getFiles() {
            try {
                const response = await fetch(apiUrl);
                const files = await response.json();
                const container = document.getElementById('file-list');
                container.innerHTML = ""; // loading စာသားကို ဖျက်မယ်

                files.forEach(file => {
                    // .html နဲ့ဆုံးပြီး index.html မဟုတ်တဲ့ ဖိုင်တွေကိုပဲ ယူမယ်
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        const div = document.createElement('div');
                        div.className = 'link-card';

                        const a = document.createElement('a');
                        // GitHub Pages path အတိုင်း link ချိတ်မယ်
                        a.href = `https://${username}.github.io/${repo}/${file.name}`;
                        a.textContent = file.name.replace('.html', '').replace(/-/g, ' ');

                        div.appendChild(a);
                        container.appendChild(div);
                    }
                });

                if(container.innerHTML === "") {
                    container.innerHTML = "HTML ဖိုင်များ မတွေ့ရှိပါ။";
                }
            } catch (error) {
                document.getElementById('file-list').innerHTML = "Error: ဖိုင်များ ဆွဲယူ၍ မရပါ။";
            }
        }

        getFiles();
    </script>
</body>
</html>
