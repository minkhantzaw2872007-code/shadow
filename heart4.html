<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Heart</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}
canvas{
    display:block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
};

function heart(t,s){
    return {
        x:s*16*Math.pow(Math.sin(t),3),
        y:-s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    };
}

let particles=[];

for(let i=0;i<2000;i++){
    let t=Math.random()*Math.PI*2;
    let target=heart(t,12+Math.random()*4);

    particles.push({
        tx:target.x,
        ty:target.y,
        x:(Math.random()-0.5)*2000,
        y:(Math.random()-0.5)*2000,
        speed:Math.random()*0.03+0.01,
        size:Math.random()*2+1
    });
}

let progress=0;

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);

    progress+=0.003;

    particles.forEach(p=>{
        p.x += (p.tx-p.x)*p.speed;
        p.y += (p.ty-p.y)*p.speed;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle="rgba(255,20,147,0.9)";
        ctx.shadowColor="hotpink";
        ctx.shadowBlur=20;
        ctx.fill();
    });

    // center fill grows slowly
    if(progress>0.5){
        let scale=(progress-0.5)*2;
        ctx.save();
        ctx.scale(scale,scale);

        ctx.beginPath();
        for(let t=0;t<Math.PI*2;t+=0.05){
            let h=heart(t,8);
            if(t===0) ctx.moveTo(h.x,h.y);
            else ctx.lineTo(h.x,h.y);
        }

        let g=ctx.createRadialGradient(0,0,5,0,0,100);
        g.addColorStop(0,"#ff66b2");
        g.addColorStop(1,"#ff1493");

        ctx.fillStyle=g;
        ctx.shadowColor="#ff1493";
        ctx.shadowBlur=40;
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
