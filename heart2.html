<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Heart Animation</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#000;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        perspective:1000px;
    }

    canvas{
        display:block;
    }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function heartShape(t){
    let x = 16 * Math.pow(Math.sin(t),3);
    let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    return {x,y};
}

class Particle{
    constructor(x,y,z){
        this.x=x;
        this.y=y;
        this.z=z;
        this.angle=0;
    }

    update(){
        this.angle += 0.02;

        let cos = Math.cos(this.angle);
        let sin = Math.sin(this.angle);

        let x = this.x*cos - this.z*sin;
        let z = this.x*sin + this.z*cos;

        let scale = 400/(400+z);

        this.sx = x*scale*12 + canvas.width/2;
        this.sy = this.y*scale*12 + canvas.height/2;
        this.size = scale*4;
    }

    draw(){
        ctx.beginPath();
        ctx.fillStyle=`rgba(255,0,80,0.8)`;
        ctx.arc(this.sx,this.sy,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

for(let i=0;i<1000;i++){
    let t = Math.random()*Math.PI*2;
    let p = heartShape(t);

    let z = (Math.random()-0.5)*80;

    particles.push(new Particle(p.x,p.y,z));
}

function animate(){
    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
</script>
</body>
</html>
