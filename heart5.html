<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Neon Particle Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* ပိုနက်တဲ့ အမည်းရောင် */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const particleCount = 1500; // အမှုန်လေးတွေ ပိုများရင် ပိုလှပါတယ်

    function getHeartPoint(t) {
        // ပိုလှပတဲ့ အသဲပုံစံ ရဖို့အတွက် scaling လုပ်ထားတာပါ
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x: x * 18, y: y * 18 };
    }

    class Particle {
        constructor() {
            this.init();
        }

        init() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            
            const t = Math.random() * Math.PI * 2;
            const target = getHeartPoint(t);
            this.targetX = target.x + canvas.width / 2;
            this.targetY = target.y + canvas.height / 2;

            this.speed = Math.random() * 0.03 + 0.015;
            this.size = Math.random() * 1.5 + 0.5;
            
            // Neon pink နဲ့ Red ကြား အရောင်ပြောင်းလဲမှု
            const hue = Math.random() * 20 + 330; 
            this.color = `hsla(${hue}, 100%, 70%, ${Math.random() * 0.8 + 0.2})`;
        }

        update() {
            // လှုပ်ရှားမှုက ပိုညင်သာအောင် (Smooth movement)
            this.x += (this.targetX - this.x) * this.speed;
            this.y += (this.targetY - this.y) * this.speed;

            // ကြယ်လေးတွေ လင်းလက်နေသလို Floating Effect ထည့်ခြင်း
            this.x += Math.sin(Date.now() * 0.002) * 0.3;
            this.y += Math.cos(Date.now() * 0.002) * 0.3;
        }

        draw() {
            ctx.shadowBlur = 10; // အရောင်တောက်တောက် (Neon Glow) ထွက်လာဖို့
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function init() {
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        // နောက်က အလင်းတန်းလေးတွေ ကျန်ခဲ့ဖို့ semi-transparent black ကိုသုံးပါတယ်
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // screen size ပြောင်းရင် အမှုန်တွေကို နေရာပြန်ချပေးဖို့
        particles.forEach(p => p.init());
    });

    init();
    animate();
</script>

</body>
</html>
